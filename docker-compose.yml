# Local infrastructure for running the service from Maven:
#
#   docker compose up -d --wait
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
#
# The `local` Spring profile (src/main/resources/application-local.yaml) points
# at the ports published below. Not meant for production use.

name: notification-service

services:
  kafka:
    # Same image the integration tests start through Testcontainers. A single-node
    # KRaft broker with two client listeners (this mirrors the image's default
    # configuration plus the second listener):
    #   - PLAINTEXT_HOST, localhost:9092: the service and tools on the host
    #   - PLAINTEXT,      kafka:19092:    other containers (kafka-ui); inside a container
    #                                     "localhost" is the container itself, so the
    #                                     host listener is unreachable from there
    image: apache/kafka:latest
    container_name: notification-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT_HOST://:9092,PLAINTEXT://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-ui:
    # Browser UI to inspect topics and produce test messages (http://localhost:8081).
    # kafbat is the maintained fork of provectus/kafka-ui. Development convenience only:
    # it has no authentication.
    image: kafbat/kafka-ui:latest
    container_name: notification-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      # Host port 8081, because 8080 is the notification service.
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "false"
    restart: unless-stopped

  postgres:
    # Pinned to 17: 18+ moved the data directory, which breaks the
    # conventional /var/lib/postgresql/data volume mount below.
    image: postgres:17
    container_name: notification-postgres
    ports:
      # Host port 5433, because 5432 is commonly taken by a local PostgreSQL.
      - "5433:5432"
    environment:
      POSTGRES_DB: notification_service
      # Same variables the `local` profile reads, so one export configures both.
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d notification_service"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  notification-postgres-data:
