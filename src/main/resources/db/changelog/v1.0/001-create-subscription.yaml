databaseChangeLog:
  - changeSet:
      id: v1.0-001-create-subscription
      author: notification-service
      changes:
        - createSequence:
            sequenceName: subscription_seq
            startValue: 1
            incrementBy: 50
        - createTable:
            tableName: subscription
            columns:
              - column:
                  name: id
                  type: bigint
                  defaultValueSequenceNext: subscription_seq
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_subscription
                    nullable: false
              - column:
                  name: client_id
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: webhook_url
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: subscription
            constraintName: uq_subscription_client_event_type
            columnNames: client_id, event_type
        - createIndex:
            tableName: subscription
            indexName: idx_subscription_event_type_status
            columns:
              - column:
                  name: event_type
              - column:
                  name: status
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: "COMMENT ON COLUMN subscription.client_id IS 'The logical identifier of the client this subscription belongs to.'"
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: "COMMENT ON COLUMN subscription.event_type IS 'The business event type the client wants to be notified about. Values correspond to the EventType Java enum.'"
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: "COMMENT ON COLUMN subscription.status IS 'Possible values: ACTIVE, INACTIVE. Must correspond to the SubscriptionStatus Java enum.'"
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: "COMMENT ON COLUMN subscription.webhook_url IS 'The webhook URL the notification payload is POSTed to. The only delivery channel is WEBHOOK.'"
      rollback:
        - dropTable:
            tableName: subscription
        - dropSequence:
            sequenceName: subscription_seq
